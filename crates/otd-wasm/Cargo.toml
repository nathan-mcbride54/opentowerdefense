[package]
name = "otd-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wasm bindings for Open Tower Defense"

[lib]
crate-type = ["cdylib"]

[dependencies]
otd-core = { path = "../otd-core" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

# wasm-pack's release default is `-O` (size-biased). `-O3` inlines more aggressively,
# which is a clear win on the numeric tick. Wasm arithmetic is strictly IEEE-754 and
# binaryen will not reassociate floats, so this cannot change sim results.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
