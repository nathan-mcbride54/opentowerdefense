<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- ?v is a cache-buster. Browsers keep favicons in a store that survives a hard
		     reload, so changing the file alone leaves the old icon in the tab. Bump this
		     whenever the icon art changes. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=2" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0a0b" />
		<meta
			name="description"
			content="Open Tower Defense — shape the path, keep the lamp lit. An open-source maze tower defense."
		/>
		<title>Open Tower Defense</title>

		<!-- Link previews (Discord, Slack, iMessage, X, Facebook…). og.png is generated
		     by `npm run og` in web/ from scripts/og.html; keep the URLs absolute — most
		     unfurlers ignore relative image paths. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Open Tower Defense" />
		<meta property="og:title" content="Open Tower Defense" />
		<meta
			property="og:description"
			content="Shape the path. Keep the lamp lit. A free, open-source maze tower defense you can play in your browser."
		/>
		<meta property="og:url" content="https://opentd.fileark.ca/" />
		<meta property="og:image" content="https://opentd.fileark.ca/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Open Tower Defense — a lit lantern over a dark battlefield grid" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Open Tower Defense" />
		<meta
			name="twitter:description"
			content="Shape the path. Keep the lamp lit. A free, open-source maze tower defense you can play in your browser."
		/>
		<meta name="twitter:image" content="https://opentd.fileark.ca/og.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
