<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- ?v is a cache-buster. Browsers keep favicons in a store that survives a hard
		     reload, so changing the file alone leaves the old icon in the tab. Bump this
		     whenever the icon art changes. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=2" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0a0b" />
		<meta
			name="description"
			content="Open Tower Defense — shape the path, keep the lamp lit. An open-source maze tower defense."
		/>
		<title>Open Tower Defense</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
