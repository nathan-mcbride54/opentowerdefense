<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
	<!-- Lantern Dusk: a lit relay lamp. Warm light in a dark world. -->
	<defs>
		<radialGradient id="glow" cx="50%" cy="46%" r="52%">
			<stop offset="0%" stop-color="#f0a94c" stop-opacity=".55"/>
			<stop offset="55%" stop-color="#f0a94c" stop-opacity=".16"/>
			<stop offset="100%" stop-color="#f0a94c" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#ffc46e"/>
			<stop offset="100%" stop-color="#c47f2c"/>
		</linearGradient>
	</defs>

	<rect width="32" height="32" rx="7" fill="#0a0a0b"/>
	<circle cx="16" cy="15" r="15" fill="url(#glow)"/>

	<!-- hanging hook -->
	<path d="M16 2v3" stroke="#8a7a5c" stroke-width="1.6" stroke-linecap="round"/>

	<!-- cap -->
	<path d="M9.5 9.5 16 5l6.5 4.5z" fill="#c47f2c"/>
	<rect x="8.5" y="9.5" width="15" height="1.8" rx=".9" fill="#8a6a34"/>

	<!-- lamp housing -->
	<path d="M10.4 11.6h11.2l-1.1 12.2a1.4 1.4 0 0 1-1.4 1.2h-6.2a1.4 1.4 0 0 1-1.4-1.2z" fill="url(#body)"/>
	<!-- flame core -->
	<ellipse cx="16" cy="17.6" rx="2.9" ry="3.6" fill="#fff6dc"/>
	<ellipse cx="16" cy="18.4" rx="1.5" ry="2" fill="#fffdf4"/>
	<!-- housing ribs, so it reads as a lamp and not a blob -->
	<path d="M12.6 11.6 12 25M19.4 11.6 20 25" stroke="#8a6a34" stroke-width=".9" opacity=".65"/>

	<!-- base -->
	<rect x="11.2" y="25" width="9.6" height="2.4" rx="1.2" fill="#8a6a34"/>
</svg>
